# Profilo "dev": database H2 in un file locale, per provare senza installare MySQL.
# Le tabelle vengono create in automatico; la console è su http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:file:./dati/gielle-dev;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
