# Backend del sito Gielle: riceve i moduli Contatti e "Lavora con noi" e li salva in MySQL.
server.port=8080

# Database MySQL (crealo con db/schema.sql, poi metti qui utente e password)
spring.datasource.url=jdbc:mysql://localhost:3306/gielle?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Rome
spring.datasource.username=gielle
spring.datasource.password=cambia-questa-password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Allegati: disegni e curriculum vengono salvati in questa cartella, nel database solo il percorso
gielle.allegati.cartella=allegati
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Indirizzi da cui il sito può inviare i moduli (Live Server di VS Code e, più avanti, il dominio vero)
gielle.sito.origini=http://127.0.0.1:5500,http://localhost:5500,https://www.giellesrl.com
